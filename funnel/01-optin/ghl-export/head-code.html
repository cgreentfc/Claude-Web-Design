<!--
  ============================================================
  THE FAMILY SHIELD PLAN — Opt-In Page: GHL Head Tracking Code
  ============================================================
  WHERE THIS GOES: this funnel step's Settings → Tracking Code → Head
  (the field that injects into that page's <head>).

  Everything below is scoped under the ".fsp-page" wrapper class so it
  can never reach GHL's own native elements on this page (cookie banners,
  other widgets, etc.) — every section fragment you paste in (see the
  section-*.html files) opens with <div class="fsp-page"> for exactly
  this reason. Do not drop that wrapper when you paste the sections in.

  FALLBACK: if this funnel step's Tracking Code field ever strips <style>
  tags, paste this entire block instead as a Custom HTML element in the
  very first row of the page, above the topbar section.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .fsp-page{
    --green-950:#0B211A;
    --green-900:#0E2A22;
    --green-700:#1C4A3B;
    --gold-500:#C9A227;
    --gold-400:#D9B23B;
    --cream:#FAF6EE;
    --cream-2:#F1EADC;
    --ink:#1A1A18;
    --ink-soft:#57574F;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --body:"Libre Franklin",-apple-system,"Segoe UI",Arial,sans-serif;
    font-family:var(--body);color:var(--ink);line-height:1.55;
  }
  .fsp-page *{box-sizing:border-box}
  .fsp-page img{max-width:100%}
  .fsp-page a{color:inherit}

  /* ---------- top bar ---------- */
  .fsp-page .topbar{background:var(--green-950);padding:18px 24px;display:flex;justify-content:center}
  .fsp-page .wordmark{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none}
  .fsp-page .wordmark svg{display:block}
  .fsp-page .wordmark span{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .fsp-page .wordmark b{color:var(--gold-500)}

  /* ---------- hero ---------- */
  /* Hero photo: family backyard cookout at golden hour, hosted from GHL's
     media library — replace the url() below with that hosted URL on import. */
  .fsp-page .hero{position:relative;background:
    linear-gradient(rgba(11,33,26,.7), rgba(11,33,26,.7)),
    url("REPLACE-WITH-GHL-HOSTED-HERO-PHOTO-URL") center 32%/cover no-repeat;
    color:var(--cream);overflow:hidden}
  .fsp-page .hero-inner{position:relative;max-width:1120px;margin:0 auto;padding:64px 24px 80px;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
  .fsp-page .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-500);margin-bottom:22px}
  .fsp-page .eyebrow::before{content:"";width:26px;height:2px;background:var(--gold-500)}
  .fsp-page .hero-headline{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.6vw,58px);line-height:1.06;letter-spacing:-.01em;text-wrap:balance;margin:0 0 22px}
  .fsp-page .hero-headline em{font-style:italic;color:var(--gold-500)}
  .fsp-page .hero-sub{font-size:18px;line-height:1.6;color:rgba(250,246,238,.85);max-width:52ch;margin:0 0 26px}
  .fsp-page .hero-sub strong{color:var(--cream)}
  .fsp-page .proofline{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:rgba(250,246,238,.72);margin:0;padding:0;list-style:none}
  .fsp-page .proofline span{display:inline-flex;align-items:center;gap:8px}
  .fsp-page .proofline svg{flex:none}

  /* ---------- form card ---------- */
  .fsp-page .form-card{background:var(--cream);color:var(--ink);border-radius:14px;padding:30px 28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:5px solid var(--gold-500);margin:0}
  .fsp-page .form-card h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
  .fsp-page .form-card p.lede{font-size:14.5px;color:var(--ink-soft);margin:0 0 20px}
  .fsp-page .field{margin-bottom:14px}
  .fsp-page .field label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .fsp-page .field input{width:100%;font-family:var(--body);font-size:16px;padding:13px 14px;border:1.5px solid #CFC6B2;border-radius:10px;background:#fff;color:var(--ink)}
  .fsp-page .field input:focus{outline:3px solid rgba(201,162,39,.45);border-color:var(--gold-500)}
  .fsp-page .btn{display:block;width:100%;font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-950);background:var(--gold-500);border:none;border-radius:10px;padding:16px 18px;cursor:pointer;transition:background .15s ease;margin:0}
  .fsp-page .btn:hover{background:var(--gold-400)}
  .fsp-page .btn:focus-visible{outline:3px solid var(--green-900);outline-offset:2px}
  .fsp-page .consent{display:flex;gap:10px;align-items:flex-start;margin:14px 0 10px}
  .fsp-page .consent input{margin-top:3px;accent-color:var(--green-900);width:16px;height:16px;flex:none}
  .fsp-page .consent label{font-size:12px;line-height:1.5;color:var(--ink-soft)}
  .fsp-page .lock-note{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);margin:0}

  /* ---------- agent trust bar ---------- */
  .fsp-page .trustbar{background:var(--cream);border-bottom:1px solid #E5DCC8}
  .fsp-page .trustbar-inner{max-width:1120px;margin:0 auto;padding:26px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px}
  .fsp-page .agent{display:flex;align-items:center;gap:14px}
  .fsp-page .agent-photo{width:56px;height:56px;border-radius:50%;background:var(--green-900);color:var(--gold-500);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px;border:2px solid var(--gold-500);flex:none}
  /* REPLACE: .agent-photo with real headshot <img>, keep 56px circle + gold ring */
  .fsp-page .agent-name{font-weight:700;font-size:15px}
  .fsp-page .agent-cred{font-size:13px;color:var(--ink-soft)}
  .fsp-page .carriers{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
  .fsp-page .carriers-label{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  .fsp-page .carrier-chip{font-size:12.5px;font-weight:600;color:var(--green-700);border:1.5px dashed #C4BA9F;border-radius:8px;padding:7px 12px;background:#fff}
  /* REPLACE: .carrier-chip elements with actual carrier logo imgs (~28px tall, grayscale) */

  /* ---------- belief section ---------- */
  .fsp-page .belief{background:var(--cream-2);padding:84px 24px}
  .fsp-page .belief-inner{max-width:1120px;margin:0 auto;text-align:center}
  .fsp-page .belief .eyebrow{color:var(--green-700)}
  .fsp-page .belief .eyebrow::before{background:var(--gold-500)}
  .fsp-page .belief h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.4vw,42px);line-height:1.12;text-wrap:balance;max-width:22ch;margin:0 auto 14px}
  .fsp-page .belief .belief-sub{font-size:17px;color:var(--ink-soft);max-width:62ch;margin:0 auto 46px}
  .fsp-page .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;text-align:left;margin:0 0 44px;padding:0;list-style:none}
  .fsp-page .stat-card{background:var(--cream);border-radius:14px;padding:30px 26px;border:1px solid #E5DCC8;display:flex;flex-direction:column;gap:10px}
  .fsp-page .stat-num{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;color:var(--green-900);font-variant-numeric:tabular-nums}
  .fsp-page .stat-num small{font-size:24px}
  .fsp-page .stat-card p{font-size:15px;line-height:1.6;color:var(--ink);margin:0}
  .fsp-page .stat-src{font-size:12px;color:var(--ink-soft);margin-top:auto}
  .fsp-page .belief-close{font-family:var(--display);font-style:italic;font-size:clamp(19px,2.2vw,24px);color:var(--green-900);max-width:44ch;margin:0 auto 30px;text-wrap:balance}
  .fsp-page .btn-secondary{display:inline-block;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--green-950);background:var(--gold-500);text-decoration:none;border-radius:10px;padding:15px 34px;transition:background .15s ease}
  .fsp-page .btn-secondary:hover{background:var(--gold-400)}

  /* ---------- footer ---------- */
  .fsp-page footer{background:var(--green-950);color:rgba(250,246,238,.75);padding:56px 24px 40px}
  .fsp-page .footer-inner{max-width:1120px;margin:0 auto}
  .fsp-page .footer-top{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid rgba(250,246,238,.15);margin-bottom:26px}
  .fsp-page .footer-links{display:flex;gap:26px;flex-wrap:wrap;font-size:13.5px}
  .fsp-page .footer-links a{color:rgba(250,246,238,.85);text-decoration:underline;text-underline-offset:3px}
  .fsp-page .footer-legal{font-size:12px;line-height:1.7;color:rgba(250,246,238,.55);max-width:100ch}
  .fsp-page .footer-legal p{margin:0 0 10px}

  /* ---------- scroll behavior for #optin / #privacy anchor links ----------
     Intentionally the one unscoped rule here: scroll-behavior only applies
     to the document's scrolling element (<html>), not to a wrapper div, and
     it's inert/harmless for anything else GHL renders on this page. */
  @media (prefers-reduced-motion: no-preference){
    html{scroll-behavior:smooth}
  }

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .fsp-page .hero-inner{grid-template-columns:1fr;gap:38px;padding:48px 20px 56px;text-align:center}
    .fsp-page .eyebrow{justify-content:center}
    .fsp-page .eyebrow::before{display:none}
    .fsp-page .hero-sub{margin-left:auto;margin-right:auto}
    .fsp-page .proofline{justify-content:center}
    .fsp-page .form-card{max-width:480px;margin:0 auto;width:100%;text-align:left}
    .fsp-page .trustbar-inner{justify-content:center;text-align:center}
    .fsp-page .carriers{margin-left:0;justify-content:center}
    .fsp-page .stats{grid-template-columns:1fr}
    .fsp-page .belief{padding:56px 20px}
  }
</style>
